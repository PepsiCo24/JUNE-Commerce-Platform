<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNE favicon — 16×16 像素栅格专版
  左 J(竖 + 左钩) + 右 E 三横,象牙白单色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="JUNE">
  <title>JUNE</title>

  <rect x="0" y="0" width="16" height="16" rx="3" ry="3" fill="#101426" />

  <g fill="#F8F6EF">
    <!-- J stem -->
    <rect x="3" y="3" width="2" height="8" />
    <!-- E top / mid / bottom -->
    <rect x="6" y="3" width="7" height="2" />
    <rect x="7" y="7" width="5" height="2" />
    <rect x="6" y="11" width="7" height="2" />
  </g>
  <!-- J left hook -->
  <path d="M4 11 A3 3 0 0 1 2 13" fill="none" stroke="#F8F6EF" stroke-width="2" stroke-linecap="round" />
</svg>
