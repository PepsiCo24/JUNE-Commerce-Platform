# ============================================================================
# JUNE-Commerce-Platform 站点配置
# 挂载位置:/etc/nginx/conf.d/june.conf
# ----------------------------------------------------------------------------
# 证书路径(容器内固定挂载点,宿主机目录由 docker-compose.yml 的
# JUNE_TLS_CERT_DIR 决定,默认 deploy/nginx/certs):
#   /etc/nginx/certs/fullchain.pem  证书 + 中间证书链
#   /etc/nginx/certs/privkey.pem    私钥
#   /etc/nginx/certs/chain.pem      仅中间证书链(OCSP stapling 用)
# 两种获取方式见 docs/DEPLOYMENT.md「TLS 证书」:
#   - Let's Encrypt:certbot webroot 模式,质询目录挂到 /var/www/acme
#   - 自签(内网/联调):deploy/scripts/gen-selfsigned-cert.sh
#
# server_name 用 `_` 通配:单机单域名部署下不需要按域名分流,
# 换域名时不用改 Nginx(域名配置集中在 .env 的 PUBLIC_WEB_ORIGIN)。
# 若要同时服务多个域名或做域名收敛跳转,把 `_` 换成实际域名列表。
# ============================================================================

# ---------------------------------------------------------------------------
# 80:健康检查 + ACME 质询 + 全量跳 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 负载均衡器/监控探活:直接由 Nginx 返回,不打后端。
    # 这样 api/web 挂掉时这个探针仍然是 200 —— 它回答的是"入口活着吗",
    # 业务就绪要看 /api/health/ready。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Let's Encrypt http-01 质询。必须在跳转之前。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443:主站
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # ---- 证书 ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ---- OCSP stapling ----
    # 由 Nginx 代客户端去取证书吊销状态并"钉"在握手里,省掉客户端一次 OCSP 查询。
    # 需要 chain.pem(中间证书)才能验证 OCSP 响应签名。
    # 自签证书没有 OCSP responder,gen-selfsigned-cert.sh 会生成一个占位 chain.pem,
    # 此时 Nginx 只会在 error.log 里打一条 warning,不影响握手。
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/chain.pem;
    # 解析 OCSP responder 域名用公共 DNS(容器内 127.0.0.11 只解析 Docker 网络内名字)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ---- 上游地址 ----
    # 用变量 + resolver,容器重建换 IP 后无需 reload(见 nginx.conf 的 resolver 说明)
    set $upstream_api api:3001;
    set $upstream_web web:3000;

    # ---- 并发连接兜底 ----
    limit_conn june_conn 400;

    # ---- 安全响应头(server 级默认)----
    # ⚠ Nginx 的 add_header 继承规则:**某个 location 里只要出现 add_header,
    #   就不再继承上层的 add_header**。所以下面几个自定义头的 location
    #   都会把这一组重复写一遍 —— 不是冗余,是必须。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HSTS 说明:max-age 一年 + includeSubDomains。
    # 没有加 preload:一旦进入浏览器预加载列表,撤销周期以月计,
    # 单机部署且域名可能变动的场景下风险大于收益。确认长期使用该域名后再加。

    # 上传上限(与 http 块一致,写在这里便于按 server 覆盖)
    client_max_body_size 25m;

    # =======================================================================
    # SSE:配置热更新与任务进度的推送通道(最关键的一段)
    # -----------------------------------------------------------------------
    # 前端每个标签页复用一条 GET /api/events/stream(见 @june/shared 的 SSE_PATH)。
    # 默认的反代参数会把 SSE 彻底毁掉,必须逐项关掉:
    #   proxy_buffering off        —— 默认开启会把事件攒在缓冲区里,
    #                                 表现是"配置改了前端 30 秒后才收到"甚至完全不动;
    #                                 这是 2 秒配置同步目标能否达成的决定性开关。
    #   gzip off                   —— 压缩会重新分帧/缓冲,破坏 SSE 的
    #                                 "\n\n 为一帧" 边界(API 侧 compression 也已对
    #                                 text/event-stream 关闭,两端都要关)。
    #   proxy_cache off            —— 事件流绝不能被缓存。
    #   proxy_set_header Connection ''
    #                              —— 清掉逐跳的 Connection 头,配合 http/1.1
    #                                 让上游保持长连接而不是被要求 close。
    #   chunked_transfer_encoding off
    #                              —— 避免在已分帧的事件流上再套一层分块编码。
    #   proxy_read_timeout 3600s   —— 心跳间隔 SSE_HEARTBEAT_MS=20s,
    #                                 读超时必须远大于心跳;设 1 小时,
    #                                 断线由前端指数退避重连(SSE_RECONNECT_*)。
    # 另外:SSE 是一条长连接,**不要**对它做 limit_req(那是按请求计数的,
    # 长连接只算 1 次请求,限了也没意义),并发保护交给 limit_conn。
    # =======================================================================
    location ^~ /api/events/ {
        proxy_pass http://$upstream_api$request_uri;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 兼容某些中间层:显式声明不要缓冲
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # 重复 server 级安全头(add_header 不继承)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log /var/log/nginx/access.log june_main;
    }

    # =======================================================================
    # 认证接口:分级限流(最严)
    # 应用层已有 RATE_LIMIT_AUTH_PER_MINUTE=10(按 IP+账号);
    # 这里 60r/m + burst 20 是兜底,只拦爆破式请求。
    # =======================================================================
    location = /api/auth/login {
        limit_req zone=june_auth burst=20 nodelay;
        proxy_pass http://$upstream_api$request_uri;
    }
    location = /api/auth/register {
        limit_req zone=june_auth burst=20 nodelay;
        proxy_pass http://$upstream_api$request_uri;
    }
    location = /api/auth/change-password {
        limit_req zone=june_auth burst=10 nodelay;
        proxy_pass http://$upstream_api$request_uri;
    }
    location = /api/auth/reauth {
        limit_req zone=june_auth burst=10 nodelay;
        proxy_pass http://$upstream_api$request_uri;
    }
    # 管理员独立登录入口
    location = /api/admin/auth/login {
        limit_req zone=june_auth burst=10 nodelay;
        proxy_pass http://$upstream_api$request_uri;
    }

    # =======================================================================
    # 上传相关:签发直传凭证 / 确认上传
    # 真正的文件字节是浏览器直传对象存储的,不经过 Nginx;这里只是 JSON 请求。
    # =======================================================================
    location ^~ /api/assets/ {
        limit_req zone=june_upload burst=40 nodelay;
        client_body_timeout 120s;   # 兼容路径可能真的传文件,给足时间
        proxy_pass http://$upstream_api$request_uri;
        proxy_read_timeout 120s;
    }

    # =======================================================================
    # AI 提交类接口:限流比普通接口更严,但要能承受 ai-burst 压测的
    # "50 人同时提交"(5r/s + burst 100 ≈ 瞬时 100 个请求放行)。
    #
    # TODO(对齐):生成相关控制器尚未落地(apps/api/src/modules 目前只有
    # auth/assets/community/health/queue/storage)。下面的前缀按
    # docs/ARCHITECTURE.md 6.5/6.6 的命名预置;控制器合并后请核对实际路径,
    # 只需改这一处正则。
    # =======================================================================
    location ~ ^/api/(generation|tasks)/ {
        limit_req zone=june_ai burst=100 nodelay;
        proxy_pass http://$upstream_api$request_uri;
        # 提交接口本身只入队并立刻返回 taskId(耗时任务在 worker),
        # 所以不需要长超时;30s 内没返回就是出问题了。
        proxy_read_timeout 30s;
    }

    # =======================================================================
    # 健康检查:注意 API 的全局前缀对 health 有 exclude(见 apps/api/src/main.ts)
    #   /health          存活(无前缀)
    #   /api/health/ready 就绪(有前缀)
    #   /health/detail   详情(无前缀,需要 x-internal-token)
    # 详情接口即使有令牌保护也不该暴露到公网 —— 它会泄漏队列深度与拓扑信息。
    # =======================================================================
    location = /health/detail {
        # 只允许容器网络内访问(宿主机排查用 docker compose exec)
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://$upstream_api$request_uri;
    }

    location = /api/health/ready {
        access_log off;
        proxy_pass http://$upstream_api$request_uri;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # =======================================================================
    # 其余 API
    # =======================================================================
    location ^~ /api/ {
        limit_req zone=june_api burst=120 nodelay;
        proxy_pass http://$upstream_api$request_uri;
        # API 只返回 JSON,可以放心开缓冲(与 SSE 相反)
        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    # =======================================================================
    # Next.js 构建产物:文件名带内容哈希,可以长缓存 + immutable
    # =======================================================================
    location ^~ /_next/static/ {
        proxy_pass http://$upstream_web$request_uri;
        proxy_cache off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # 品牌资产(@june/brand 的 SVG / 图标),文件名稳定但内容极少变动。
    # 用 30 天 + immutable:换 Logo 时通过改文件名或加查询参数破缓存。
    location ^~ /brand/ {
        proxy_pass http://$upstream_web$request_uri;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # Next 图片优化端点:结果可缓存但不能 immutable(源图可能替换)
    location ^~ /_next/image {
        proxy_pass http://$upstream_web$request_uri;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # =======================================================================
    # 页面:Next.js
    # =======================================================================
    location / {
        proxy_pass http://$upstream_web$request_uri;
        proxy_read_timeout 60s;

        # ---- CSP ----
        # style-src 必须带 'unsafe-inline':Next.js 16 / Tailwind 4 会注入
        # 内联样式(字体预加载、CSS-in-JS 的 <style>),没有它页面会白屏。
        #
        # script-src 这里给了 'unsafe-inline' —— 这是**当前的妥协**,原因:
        # Next App Router 会内联一段 bootstrap script 与流式渲染的
        # self.__next_f.push(...) 片段。要去掉 'unsafe-inline' 必须由应用侧
        # 生成 nonce:在 Next middleware 里生成随机 nonce、写进请求头并交给
        # Next 渲染,然后这里改成:
        #     script-src 'self' 'nonce-$request_id' 'strict-dynamic';
        # (注意浏览器一旦看到 nonce/strict-dynamic 就会忽略 'unsafe-inline',
        #  所以两者不能混着指望同时生效。)
        # apps/web 实现 nonce 中间件后请回来替换本行,并在 docs/ACCEPTANCE.md
        # 记录这项加固完成。
        #
        # 'unsafe-eval' **只有开发模式**(React Refresh / SWC dev overlay)需要,
        # 生产环境绝不添加。
        #
        # img-src 带 https: 与 blob::图片走对象存储/CDN 的签名 URL,
        # 上传预览用 blob:。connect-src 带 https::浏览器要直传 PUT 到对象存储。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

        # 重复 server 级安全头(add_header 不继承)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # 隐藏文件/备份文件一律拒绝(防止误把 .env、*.bak 放进静态目录)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
