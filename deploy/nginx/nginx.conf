# ============================================================================
# JUNE-Commerce-Platform Nginx 主配置
# 挂载位置:/etc/nginx/nginx.conf(镜像 nginx:1.29-alpine)
# 站点配置在 /etc/nginx/conf.d/june.conf
# ----------------------------------------------------------------------------
# 改完配置的正确姿势(先校验再热加载,避免把线上打挂):
#   docker compose exec nginx nginx -t
#   docker compose exec nginx nginx -s reload
# ============================================================================

user nginx;

# 整机 4 核,但 nginx 容器 CPU 上限只有 0.3。
# worker_processes auto 会按宿主 CPU 起 4 个 worker,和 0.3 核的配额相比毫无意义,
# 只会增加上下文切换与内存占用。TLS 终止 + 反代在 2 个 worker 下足够支撑
# 50 人在线(含每人 1 条 SSE 长连接)。
worker_processes 2;
worker_rlimit_nofile 16384;

pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# --------------------------------------------------------------------------
# Brotli:官方 nginx 镜像**不包含** ngx_brotli 模块,因此这里默认降级为只用 gzip。
# 如果要启用 brotli,二选一:
#   A) 换用带模块的镜像(例如自行基于 nginx 源码 + google/ngx_brotli 构建,
#      或使用 fholzer/nginx-brotli 这类社区镜像),然后取消下面两行注释,
#      并打开 http 块里 brotli 相关配置的注释;
#   B) 保持现状。对本平台的实际收益有限:主要静态资源是 JS/CSS(gzip 后差距
#      约 10~15%),而图片走对象存储/CDN、本来就不该再压。
# 模块文件名以镜像内 /usr/lib/nginx/modules/ 的实际文件为准。
# --------------------------------------------------------------------------
# load_module modules/ngx_http_brotli_filter_module.so;
# load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- 基础行为 ----
    server_tokens off; # 不回显版本号
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    absolute_redirect off;
    port_in_redirect off;

    # keepalive:浏览器侧长连接,减少 50 人在线时的握手开销
    keepalive_timeout 65s;
    keepalive_requests 1000;

    # ---- 请求体与超时 ----
    # 上传上限与 .env 的 UPLOAD_MAX_BYTES=20971520(20MB)对齐,
    # 这里留 5MB 余量给 multipart 边界与请求头(25m),
    # 真正的大小判定在 API(签发直传凭证时校验)与对象存储侧。
    # 注意:正常上传链路是浏览器直传对象存储,不经过 Nginx;
    # 这个上限保护的是 /api 的 JSON 与兼容路径。
    client_max_body_size 25m;
    client_body_buffer_size 256k;
    client_body_timeout 60s;
    client_header_timeout 20s;
    send_timeout 60s;
    large_client_header_buffers 4 16k;

    # ---- DNS:容器重建后 IP 会变 ----
    # Docker 内置 DNS 在 127.0.0.11。nginx 只在启动时解析 upstream 名字,
    # 因此 `docker compose up -d api` 重建容器后会一直 502。
    # 解决办法:proxy_pass 用变量 + resolver,让 nginx 每次按 TTL 重新解析。
    # 代价:失去到上游的 keepalive 连接池(容器内网短连接开销很小,可接受)。
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # ---- 日志 ----
    # 带上 $request_time / $upstream_response_time:deploy/scripts/monitor.sh
    # 直接从访问日志算接口 P95,不依赖额外的 APM 组件。
    log_format june_main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'xff="$http_x_forwarded_for" rt=$request_time urt="$upstream_response_time" '
        'cs=$upstream_cache_status host="$host"';
    access_log /var/log/nginx/access.log june_main buffer=32k flush=5s;

    # ---- gzip(只压文本)----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;      # 5 是压缩率/CPU 的平衡点(容器只有 0.3 核)
    gzip_min_length 1024;   # 小于 1KB 压了反而更大
    gzip_proxied any;
    gzip_disable "msie6";
    # 只列文本类型。**不要**加 image/jpeg、image/png、image/webp、image/avif:
    # 它们已经是压缩格式,再压一遍浪费 CPU 且几乎不减小体积。
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-javascript
        application/xhtml+xml
        application/xml
        font/ttf
        font/otf
        image/svg+xml
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml;
    # text/html 默认就压,不需要也不能重复声明

    # ---- brotli(需要模块;见文件顶部说明)----
    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 1024;
    # brotli_static on;
    # brotli_types 同上 gzip_types 列表(同样不要包含已压缩的图片格式);

    # ---- 限流区(应用层限流之外的兜底)----
    # 设计原则:**比应用层更宽**。应用层按用户/会话限流(见 .env 的
    # RATE_LIMIT_* 与 @nestjs/throttler),那是业务判定;nginx 这层只拦
    # "明显异常的量",避免误伤正常用户。
    #
    # ⚠ 关键前提:这里按 $binary_remote_addr(真实客户端 IP)计数。
    #    如果 50 个用户在同一个办公网出口 NAT 后面,他们**共享同一个 IP**,
    #    阈值必须按"整个出口"而不是"单个用户"来设,否则一上线就集体 429。
    #    因此下面的速率都留了很大余量,真正精确的限流交给应用层(按用户维度)。
    #
    # 换算依据(.env.example):
    #   RATE_LIMIT_GLOBAL_PER_MINUTE=600  → 10 r/s/用户;这里给 60 r/s(约 6 倍余量)
    #   RATE_LIMIT_AUTH_PER_MINUTE=10     → 这里给 60 r/m(6 倍余量)
    #   RATE_LIMIT_UPLOAD_PER_MINUTE=60   → 这里给 10 r/s
    #   RATE_LIMIT_AI_SUBMIT_PER_MINUTE=20 → 这里给 5 r/s(压测 ai-burst 要 50 人同时提交)
    limit_req_zone $binary_remote_addr zone=june_api:10m       rate=60r/s;
    limit_req_zone $binary_remote_addr zone=june_auth:5m       rate=60r/m;
    limit_req_zone $binary_remote_addr zone=june_upload:5m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=june_ai:5m         rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # 并发连接数。每个标签页 1 条 SSE 长连接 + 若干普通请求;
    # 同一 NAT 出口下 50 人可能开 100+ 标签页,所以给 400。
    limit_conn_zone $binary_remote_addr zone=june_conn:10m;
    limit_conn_status 429;

    # ---- 反代公共头 ----
    # API 已配置 trust proxy = TRUST_PROXY_HOPS(默认 1):
    # $proxy_add_x_forwarded_for 会在客户端伪造的 XFF 后面追加真实 $remote_addr,
    # Express 按"信任 1 跳"从右往左剥离,正好拿到真实客户端 IP 用于限流与审计。
    # 所以这里必须用 $proxy_add_x_forwarded_for,不能用 $remote_addr 覆盖。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    # 上游 5xx/超时不自动重试非幂等请求:生图提交这类接口重试会重复计费。
    # 幂等性由应用层的 idempotencyKey 保证,不靠代理层瞎重试。
    proxy_next_upstream off;
    proxy_intercept_errors off;

    # ---- TLS 全局参数(证书路径在 conf.d/june.conf 里)----
    ssl_protocols TLSv1.2 TLSv1.3;
    # 现代 cipher 套件(Mozilla Intermediate):TLS1.3 的套件由 OpenSSL 自行选择,
    # 下面这组是给 TLS1.2 客户端的,全部是 ECDHE + AEAD,无 CBC、无 RSA 密钥交换。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # TLS1.3 下客户端偏好更优(客户端更清楚自己的硬件加速能力)
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:JUNE_SSL:10m;
    ssl_session_timeout 1d;
    # 关闭会话票据:票据密钥不轮换会削弱前向安全性
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    include /etc/nginx/conf.d/*.conf;
}
