<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNE 横向组合标 — 浅色背景版(自带象牙白底)

  ⚠ 待对照用户提供的品牌设计图校准(当前为按书面规则制作的初稿)

  版式与 lockup-horizontal.svg 完全一致(viewBox 400×144,图标 ×1.5,字标 x 130..364)。
  配色与一块铺满 viewBox 的象牙白底:
    · 底色     象牙白 ivory[50] #F8F6EF
    · JUN / J  深靛蓝 indigo[900] #101426,与底色对比度约 16.9:1
    · E        深青绿 teal[700] #0C7E72,与底色对比度约 4.59:1(纯白底 4.95:1)
    · 连接点   purple[500] #7B65F7,与底色对比度约 3.9:1,满足图形元素 3:1 下限

  为什么浅底不用品牌青绿 #56DECD / 辅助紫 #9B8AFB
    #56DECD 在白底只有 1.6:1,#9B8AFB 在白底只有约 2.8:1,
    两者都低于 WCAG 对图形元素要求的 3:1,小尺寸下会直接消失。
    浅色背景一律降到 teal[700] #0C7E72 与 purple[500] #7B65F7(两者都在
    packages/shared/src/brand.ts 的 COLOR_SCALES 内,不是新起的色值)。

  留白规则(clear space)
    最小留白 = 图标高度 × 0.5 = 36 单位,即底色矩形四周的空白区,
    不得叠加元素,不得裁切。

  使用限制:整体等比缩放;禁止拉伸变形、禁止改色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 144" width="400" height="144"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="JUNE">
  <title>JUNE</title>

  <!-- 象牙白底 -->
  <rect x="0" y="0" width="400" height="144" fill="#F8F6EF" />

  <!-- 图标 -->
  <g transform="translate(24 24) scale(1.5)">
    <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#0C7E72" d="M52 12 H12 V51 H22" />
      <path stroke="#0C7E72" d="M12 31 H30" />
      <path stroke="#101426" d="M52 12 V33 A18 18 0 0 1 34 51" />
    </g>
    <circle cx="28" cy="51" r="5" fill="#7B65F7" />
  </g>

  <!-- 字标 JUNE -->
  <g transform="translate(130 24)" fill="none" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#101426">
      <path d="M24 26 V52 A18 18 0 0 1 6 70" />
      <path d="M56 26 V52 A18 18 0 0 0 92 52 V26" />
      <path d="M124 70 V26 L160 70 V26" />
    </g>
    <g stroke="#0C7E72">
      <path d="M228 26 H192 V70 H228" />
      <path d="M192 48 H220" />
    </g>
  </g>
</svg>
