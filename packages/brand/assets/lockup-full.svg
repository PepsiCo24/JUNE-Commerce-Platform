<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNE 完整组合标(图标 + JUNE 字标 + COMMERCE PLATFORM 副标)— 浅色背景默认版

  ⚠ 待对照用户提供的品牌设计图校准(当前为按书面规则制作的初稿)

  版式(viewBox 400×156):
    · 文字块 = 字标(大写字高 56,顶线 y=36 / 基线 y=92)
              + 16 单位行距
              + 副标(大写字高约 12,顶线 y=108 / 基线 y=120)
    · 图标:64 栅格 ×1.5 → 墨迹 72×72,落在 x 36..108 / y 42..114,
      垂直居中对齐整个文字块(文字块中线 y=78)
    · 副标与字标左对齐(x=130),并用 textLength=234 强制与字标等宽,
      因此无论落到哪个系统字体上,副标的实际宽度都恒等于字标宽度。

  副标文字固定为 COMMERCE PLATFORM,拼写不可更改,不得添加任何口号。
  副标使用系统字体栈(对应 shared/brand.ts 的 FONT_STACKS.brand);
  若用于印刷或需要绝对一致的渲染,请先把 text 元素转为轮廓路径再交付。

  留白规则(clear space)
    最小留白 = 图标高度 × 0.5 = 72 × 0.5 = 36 单位,已内建在 viewBox 四周。
    该留白区内不得出现任何其他元素,也不得被容器裁切。

  取色:JUN/J = indigo[900] #101426,E = teal[700] #0C7E72,
        连接点 = purple[500] #7B65F7,副标 = neutral[600] #585853
  使用限制:整体等比缩放;禁止拉伸变形、禁止改字距行距、禁止任意改色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 156" width="400" height="156"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="JUNE COMMERCE PLATFORM">
  <title>JUNE COMMERCE PLATFORM</title>

  <!-- 图标 -->
  <g transform="translate(24 30) scale(1.5)">
    <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#0C7E72" d="M52 12 H12 V51 H22" />
      <path stroke="#0C7E72" d="M12 31 H30" />
      <path stroke="#101426" d="M52 12 V33 A18 18 0 0 1 34 51" />
    </g>
    <circle cx="28" cy="51" r="5" fill="#7B65F7" />
  </g>

  <!-- 字标 JUNE -->
  <g transform="translate(130 16)" fill="none" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#101426">
      <path d="M24 26 V52 A18 18 0 0 1 6 70" />
      <path d="M56 26 V52 A18 18 0 0 0 92 52 V26" />
      <path d="M124 70 V26 L160 70 V26" />
    </g>
    <g stroke="#0C7E72">
      <path d="M228 26 H192 V70 H228" />
      <path d="M192 48 H220" />
    </g>
  </g>

  <!-- 副标 COMMERCE PLATFORM -->
  <text x="130" y="120" textLength="234" lengthAdjust="spacing"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="600" fill="#585853">COMMERCE PLATFORM</text>
</svg>
