<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNE 品牌图标 — 完整细节版(浅色背景默认版)

  ⚠ 待对照用户提供的品牌设计图校准(当前为按书面规则制作的初稿)

  几何构成(64×64 栅格,墨迹精确占据 8..56 的 48×48 正方形,四周留 8 单位气口):

    · E(青绿)= 竖脊 x=12 + 上横 y=12 + 中横 y=31 + 下横 y=51。
      三道横向笔画表达「电商平台的结构与秩序」;中横略微偏上(31 而非 31.5),
      这是无衬线 E 的常规光学修正,避免视觉上头重脚轻。

    · J(深靛蓝)= 由 E 的上横向右延伸、在 x=52 处生长出的竖笔。
      这是 J 与 E 唯一的实体融合点:上横走到 52 就换色变成 J 的竖笔。
      竖笔下行至 y=33,以圆心 (34,33)、半径 18 的正圆四分之一弧向左回转,
      落点 (34,51)。切线在 (52,33) 处为竖直、在 (34,51) 处为水平,
      与竖笔和下横的走向完全连续,不产生折角。圆弧表达「连接」。

    · 下横刻意在 x=22 收笔(墨迹到 26),与圆弧落点的笔端(墨迹起于 30)之间
      留出 4 单位缺口。图形因此是开口的,不会读成一个闭合的圆角方块,
      J 的钩形得以独立成形。

    · 紫色连接珠 r=5 位于 (28,51),正好坐在上述缺口上、同时压住两端笔尖 ——
      这就是 J 与 E 的连接处。面积约占画布 1.9%,仅作局部点缀,
      不得放大、不得用作主色、不得挪到别处。
      连接珠直径 10 比笔画宽 8 大 2,是刻意的「节点」感;
      加上它之后下横一线的墨迹右缘到 33,与中横墨迹右缘 34 基本齐平,
      三道横画的长度关系因此仍然成立。

  取色(全部来自 packages/shared/src/brand.ts,不得另起色值):
    深靛蓝 indigo[900] #101426 / 深青绿 teal[700] #0C7E72 / 辅助紫 purple[500] #7B65F7

  为什么浅底版用 teal[700] 而不是品牌青绿 #56DECD:
    #56DECD 在白底只有 1.6:1,达不到 WCAG 图形元素 3:1 的最低要求;
    teal[700] #0C7E72 在白底为 4.95:1。深色背景版请用 icon-mono.svg 着色,
    或直接使用 lockup-horizontal-dark-bg.svg / icons/app-icon-*.svg。

  使用限制:禁止拉伸变形(务必等比缩放)、禁止任意改色、禁止把品牌展示图当 Logo。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="JUNE">
  <title>JUNE</title>

  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- E:上横(右端延伸至 x=52 交给 J)+ 竖脊 + 下横(在 x=22 收笔留出缺口) -->
    <path stroke="#0C7E72" d="M52 12 H12 V51 H22" />
    <!-- E:中横(最细的识别细节,小尺寸版本会被去掉) -->
    <path stroke="#0C7E72" d="M12 31 H30" />
    <!-- J:竖笔 + 四分之一圆弧,弧线向左回转指向 E 的下横 -->
    <path stroke="#101426" d="M52 12 V33 A18 18 0 0 1 34 51" />
  </g>

  <!-- 紫色连接珠:桥接 E 的下横与 J 的弧线末端,即 J 与 E 的连接处 -->
  <circle cx="28" cy="51" r="5" fill="#7B65F7" />
</svg>
