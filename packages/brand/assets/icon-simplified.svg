<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNE 品牌图标 — 小尺寸简化版(用于 16 / 24 / 32 px)

  ⚠ 待对照用户提供的品牌设计图校准(当前为按书面规则制作的初稿)

  ⚠ 与书面要求的一处偏离,请复核:
    原要求是「去掉中间横线」。实测发现整条删掉之后,这枚图标在 24 / 32px 下
    退化成一个「圆角方块 + 右下角缺口」,E 完全消失,辨识度反而低于保留中横的版本
    (对比截图见 docs/BRAND.md 的辨识度检查一节)。
    根本原因是本图标是等线设计(所有笔画同宽 8),并不存在一条「最细的笔画」;
    真正在小尺寸下先崩掉的细节是下横的缺口与连接珠,而不是中横。
    因此这里把「减少细节」落实为:缩短中横 + 加粗主体 + 收窄缺口,
    而不是删掉中横。如果你更希望严格按原要求执行,把下面那条
    `M13 32 H28` 删掉即可,其余几何无需改动。

  与完整版 icon.svg 的差异(四处取舍):
    1. 笔画由 8 加粗到 10 —— 保证 16px 下每道笔画约 2.5 实际像素,不被抗锯齿吃掉。
    2. 中横由 x=12..30 缩短为 x=13..28,并与上下横拉开等距的 9 单位白间隙
       (16px 下约 2.25 像素),避免三道横画在小尺寸下并成一团灰块。
    3. 下横由 x=22 提前到 x=20 收笔,缺口由 4 单位收到 3 单位,
       让加粗后的笔端不至于把缺口吞掉。
    4. 连接珠 r=5 位置右移到 (26,51),仍然压住缺口两端;
       加粗到 10 之后它正好内接于笔画带(46..56),不再外凸,小尺寸下边缘更干净。

  墨迹仍精确占据 8..56 的 48×48 正方形,与完整版共享同一外框,可直接原地互换。

  取色:indigo[900] #101426 / teal[700] #0C7E72 / purple[500] #7B65F7
  使用限制:禁止拉伸变形、禁止任意改色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="JUNE">
  <title>JUNE</title>

  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- E:上横 + 竖脊 + 下横(在 x=20 收笔留出缺口) -->
    <path stroke="#0C7E72" d="M51 13 H13 V51 H20" />
    <!-- E:中横(缩短版) -->
    <path stroke="#0C7E72" d="M13 32 H28" />
    <!-- J:竖笔 + 四分之一圆弧 -->
    <path stroke="#101426" d="M51 13 V33 A18 18 0 0 1 33 51" />
  </g>

  <!-- 紫色连接珠:J 与 E 的连接处 -->
  <circle cx="26" cy="51" r="5" fill="#7B65F7" />
</svg>
