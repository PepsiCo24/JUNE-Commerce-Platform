<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNE 完整组合标 — 单色版(currentColor)

  ⚠ 待对照用户提供的品牌设计图校准(当前为按书面规则制作的初稿)

  版式与 lockup-full.svg 完全一致(viewBox 400×156),全部元素使用 currentColor,
  由父元素的 CSS color 统一着色。适用于:单色印刷、烫印、水印、
  第三方合作方要求的单色标、以及背景色不可控的嵌入场景。

  推荐着色(均取自 packages/shared/src/brand.ts,不得另起色值):
    · 深靛蓝背景  → color: #F8F6EF(17.1:1)或 #56DECD(11.3:1)
    · 白 / 浅灰背景的小尺寸 → color: #0C7E72(4.95:1)
    · 白 / 浅灰背景的大尺寸 → color: #101426(约 16.9:1)

  单色化的两点处理:
    1. 紫色连接点改为 currentColor 实心圆(r=5.5,比笔画半宽 4 大 1.5),
       连接处仍读作一个「节点」,保留 J 闭合回 E 的语义。
    2. 副标不再降饱和/降明度,与字标同色;靠字号(17 对大写字高 56)
       和字距建立层级。

  留白规则(clear space)
    最小留白 = 图标高度 × 0.5 = 36 单位,已内建在 viewBox 四周,不得叠加元素或裁切。

  使用限制:整体等比缩放;禁止拉伸变形;单色版只允许整体换色,不允许给局部单独上色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 156" width="400" height="156"
     preserveAspectRatio="xMidYMid meet" fill="currentColor" role="img"
     aria-label="JUNE COMMERCE PLATFORM">
  <title>JUNE COMMERCE PLATFORM</title>

  <!-- 图标 -->
  <g transform="translate(24 30) scale(1.5)">
    <g fill="none" stroke="currentColor" stroke-width="8"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M52 12 H12 V51 H22" />
      <path d="M12 31 H30" />
      <path d="M52 12 V33 A18 18 0 0 1 34 51" />
    </g>
    <circle cx="28" cy="51" r="5" fill="currentColor" />
  </g>

  <!-- 字标 JUNE -->
  <g transform="translate(130 16)" fill="none" stroke="currentColor" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 26 V52 A18 18 0 0 1 6 70" />
    <path d="M56 26 V52 A18 18 0 0 0 92 52 V26" />
    <path d="M124 70 V26 L160 70 V26" />
    <path d="M228 26 H192 V70 H228" />
    <path d="M192 48 H220" />
  </g>

  <!-- 副标 COMMERCE PLATFORM -->
  <text x="130" y="120" textLength="234" lengthAdjust="spacing"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="600" fill="currentColor">COMMERCE PLATFORM</text>
</svg>
