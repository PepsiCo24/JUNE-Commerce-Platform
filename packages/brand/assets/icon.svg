<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNE 品牌图标 — 完整细节版(浅色背景默认版)

  已按官方品牌设计稿校准:
    · J(深靛蓝)在左:竖笔 + 左下四分之一弧
    · E(品牌青绿)在右:三道独立横画
    · 紫色连接珠落在 J 内侧凹槽(竖笔与弯钩之间,画在 J 之下)

  64×64 栅格,墨迹约 8..56。
  取色:indigo[900] #101426 / teal[400] #56DECD / purple[400] #9B8AFB
  使用限制:禁止拉伸变形、禁止任意改色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="JUNE">
  <title>JUNE</title>

  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#56DECD" d="M28 12 H52" />
    <path stroke="#56DECD" d="M34 31 H48" />
    <path stroke="#56DECD" d="M30 51 H52" />
  </g>
  <circle cx="29" cy="39" r="5" fill="#9B8AFB" />
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#101426" d="M20 12 V36 A16 16 0 0 1 8 52" />
  </g>
</svg>
